# Hyprland lock screen
#
# PURPOSE: Defines lock-screen appearance and input fields.
# ROLE: Works with hypridle and the chosen graphical session.
# CUSTOMIZATION: Do not place credentials or passwords in this file.

general {
    hide_cursor = true
    immediate_render = true
    no_fade_in = true
}

background {
    monitor =
    color = rgba(20, 20, 20, 1.0)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -20

    placeholder_text = Password...
}
