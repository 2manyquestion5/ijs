# Hyprland idle behavior
#
# PURPOSE: Locks the session after inactivity and handles sleep-related behavior.
# ROLE: Installed by the user Hyprland Home Manager module.
# CUSTOMIZATION: Review timeout and command compatibility before changing security behavior.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
